services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ${DOCKGE_STACKS_DIR}:${DOCKGE_STACKS_DIR}
    environment:
      DOCKGE_STACKS_DIR: "${DOCKGE_STACKS_DIR}"
    ports:
      - "${DOCKGE_PORT:-5001}:5001"
    restart: unless-stopped
