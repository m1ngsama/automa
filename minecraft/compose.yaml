services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-fabric
    ports:
      - "${MC_PORT:-25565}:25565"
      - "${RCON_PORT:-25575}:25575"
    environment:
      EULA: "TRUE"
      TYPE: "${MC_TYPE:-FABRIC}"
      VERSION: "${MC_VERSION:-1.21.1}"
      MEMORY: "${MC_MEMORY:-4G}"
      ONLINE_MODE: "${MC_ONLINE_MODE:-false}"
      ENABLE_RCON: "true"
      RCON_PORT: 25575
      RCON_PASSWORD: "${RCON_PASSWORD}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./data:/data
    healthcheck:
      test: mc-health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    tty: true
    stdin_open: true
